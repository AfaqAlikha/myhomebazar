<app-hero-swiper [slides]="featured" [loading]="heroLoading"></app-hero-swiper>

<div class="container mx-auto px-2 my-4">
  <section class="my-4">
    <h2 class="text-3xl font-bold mb-2 text-[var(--color-accent)] dark:text-[var(--color-accent)]">
      Shop by Categories
    </h2>
    <div class="w-16 h-1 rounded my-2" style="background-color: var(--color-accent)"></div>
    <app-category-links></app-category-links>
  </section>

  <section class="my-4">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-2">
      <div>
        <h2 class="text-3xl font-bold mb-2 text-[var(--color-accent)] dark:text-[var(--color-accent)]">
          Popular Products
        </h2>
        <div class="w-16 h-1 rounded my-2" style="background-color: var(--color-accent)"></div>
      </div>

      <button
        type="button"
        class="grid-layout-toggle"
        (click)="cycleGridLayout()"
        [attr.aria-label]="gridLayoutLabel"
        [title]="gridLayoutLabel"
      >
        <mat-icon>{{ gridLayoutIcon }}</mat-icon>
      </button>
    </div>

    <app-product-search-filter
      [initial]="productSearchFilters"
      (filterChange)="onProductSearchFilter($event)"
    ></app-product-search-filter>

    <p
      *ngIf="!isLoading && !products.length"
      class="text-center text-sm text-[var(--color-text-secondary)] py-8"
    >
      No products found. Try changing your search or filters.
    </p>

    <div class="my-3 grid gap-4 home-product-grid" [ngClass]="productGridClass">
      <ng-container *ngIf="!isLoading">
        <div *ngFor="let product of products" class="home-product-grid-item">
          <app-product-card [product]="product"></app-product-card>
        </div>
      </ng-container>

      <ng-container *ngIf="isLoading">
        <div
          *ngFor="let i of [1, 2, 3, 4, 5, 6, 7, 8]"
          class="home-product-grid-item p-4 bg-gray-200 rounded animate-pulse h-80 w-full"
        ></div>
      </ng-container>
    </div>

    <div *ngIf="loadingMore" class="flex justify-center py-4">
      <div class="h-10 w-10 rounded-full border-4 border-[var(--color-accent)] border-t-transparent animate-spin"></div>
    </div>

    <div *ngIf="!isLoading && hasMore && products.length" class="flex justify-center py-4">
      <button
        type="button"
        class="load-more-btn"
        (click)="loadMoreProducts()"
        [disabled]="loadingMore"
      >
        {{ loadingMore ? 'Loading…' : 'Load More' }}
      </button>
    </div>

    <p
      *ngIf="!isLoading && !loadingMore && products.length && !hasMore"
      class="text-center text-sm text-[var(--color-text-secondary)] py-3"
    >
      You have reached the end of the list.
    </p>

    <app-google-ad variant="horizontal" layoutClass="container mx-auto px-4 mt-4 mb-2"></app-google-ad>
  </section>
</div>
