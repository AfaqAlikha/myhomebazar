<app-ui-card class="w-full border-0 rounded-0">
  <header class="site-header site-header--glass sticky top-0 left-0 right-0 z-50">
    <div class="container mx-auto px-3 py-2.5 md:py-3">
      <div class="header-mockup-row flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button
            type="button"
            mat-icon-button
            class="md:hidden !flex-shrink-0"
            (click)="openDrawer()"
            aria-label="Open menu"
          >
            <mat-icon>menu</mat-icon>
          </button>

          <a routerLink="/" class="header-brand flex items-center gap-2.5 min-w-0">
            <img
              *ngIf="logo?.image"
              [src]="logo.image"
              [alt]="logo.name || 'MyHouseBazar'"
              class="header-brand__logo"
            />
            <img
              *ngIf="!logo?.image"
              src="logo.png"
              alt="MyHouseBazar"
              class="header-brand__logo"
            />
            <span class="hidden sm:block min-w-0">
              <span class="header-brand__name">MyHouseBazar</span>
              <span class="header-brand__tag">Pakistan 🇵🇰</span>
            </span>
          </a>
        </div>

        <a
          routerLink="/shop"
          class="header-search-pill hidden lg:flex flex-1 max-w-xl mx-2"
          aria-label="Search products in shop"
        >
          <span class="header-search-pill__placeholder">Search for products, brands or sellers…</span>
          <span class="header-search-pill__btn" aria-hidden="true">
            <mat-icon>search</mat-icon>
          </span>
        </a>

        <nav class="header-quick-nav hidden md:flex items-center gap-4">
          <a routerLink="/shop" routerLinkActive="header-quick-nav__link--active" class="header-quick-nav__link">
            <mat-icon>storefront</mat-icon>
            <span>Shop</span>
          </a>
          <a routerLink="/sellers" routerLinkActive="header-quick-nav__link--active" class="header-quick-nav__link">
            <mat-icon>groups</mat-icon>
            <span>Sellers</span>
          </a>
          <a routerLink="/cart" routerLinkActive="header-quick-nav__link--active" class="header-quick-nav__link">
            <span class="header-quick-nav__icon-wrap">
              <mat-icon>shopping_cart</mat-icon>
              <span *ngIf="cartCount > 0" class="header-quick-nav__badge">{{ cartCount > 9 ? '9+' : cartCount }}</span>
            </span>
            <span>Cart</span>
          </a>
          <button
            type="button"
            class="header-quick-nav__link header-quick-nav__link--btn"
            (click)="toggleTheme()"
            [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
            [title]="isDarkMode ? 'Light mode' : 'Dark mode'"
          >
            <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
            <span>{{ isDarkMode ? 'Light' : 'Dark' }}</span>
          </button>
          <button
            type="button"
            class="header-quick-nav__link header-quick-nav__link--btn"
            [matMenuTriggerFor]="accountMenu"
          >
            <mat-icon>account_circle</mat-icon>
            <span>Account</span>
          </button>
          <mat-menu #accountMenu="matMenu" xPosition="before">
            @if (token) {
              <a mat-menu-item routerLink="/my-acount">Profile</a>
              <a mat-menu-item routerLink="/messages">Messages</a>
              <a mat-menu-item routerLink="/wishlist">Wishlist</a>
              <a mat-menu-item routerLink="/order-history">Orders</a>
              <button mat-menu-item (click)="logout()">Logout</button>
            } @else {
              <a mat-menu-item routerLink="/signin">Sign In</a>
              <a mat-menu-item routerLink="/signup">Sign Up</a>
            }
          </mat-menu>
        </nav>

        <div class="flex items-center gap-1 md:hidden">
          <button
            mat-icon-button
            type="button"
            (click)="toggleTheme()"
            [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          >
            <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
          </button>
        </div>
      </div>

      <p class="header-mobile-tag md:hidden text-center text-[10px] tracking-wide uppercase text-[var(--color-text-secondary)] mt-1">
        Pakistan's Home & Living Marketplace
      </p>
    </div>
  </header>
</app-ui-card>
