<div class="category-swiper-shell">
  <button
    type="button"
    class="category-swiper-nav category-swiper-prev"
    aria-label="Previous categories"
    [class.swiper-button-disabled]="prevDisabled"
    [disabled]="prevDisabled"
    (click)="slidePrev()"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>

  <div #swiperEl class="swiper category-swiper">
    <div class="swiper-wrapper">
      <a
        *ngFor="let category of categories"
        [routerLink]="['/category', category.name, category._id]"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="swiper-slide category-slide group"
      >
        <div
          class="relative flex flex-col items-center justify-center w-full h-full bg-[var(--color-card)] border border-[var(--color-border)] rounded-lg shadow-md p-3 transition-colors duration-300"
        >
          <div
            class="category-image-wrap flex items-center justify-center overflow-hidden rounded-full border border-[var(--color-border)] bg-[var(--color-background)]"
          >
            <img
              *ngIf="category.images && category.images.length > 0"
              [src]="category.images[0]"
              [alt]="category.name"
              class="category-image w-full h-full object-contain"
            />
            <span
              *ngIf="!category.images?.length"
              class="category-fallback flex items-center justify-center w-full h-full bg-[var(--color-accent)] text-[var(--color-text)] dark:text-[var(--color-text)] text-xl font-bold"
            >
              {{ category.name.charAt(0) }}
            </span>
          </div>

          <p
            class="category-name font-medium text-sm text-[var(--color-text)] dark:text-[var(--color-text)] text-center mt-2 line-clamp-2 w-full"
          >
            {{ category.name }}
          </p>
        </div>
      </a>
    </div>
  </div>

  <button
    type="button"
    class="category-swiper-nav category-swiper-next"
    aria-label="Next categories"
    [class.swiper-button-disabled]="nextDisabled"
    [disabled]="nextDisabled"
    (click)="slideNext()"
  >
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
