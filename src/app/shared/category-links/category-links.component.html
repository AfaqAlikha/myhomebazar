<div class="category-swiper-shell">
  <button
    type="button"
    class="category-swiper-nav category-swiper-prev"
    aria-label="Previous categories"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>

  <div #swiperEl class="swiper category-swiper">
    <div class="swiper-wrapper">
      <a
        *ngFor="let category of categories"
        [routerLink]="['/category', category.name, category._id]"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="swiper-slide category-slide w-36 h-36 rounded-lg shadow-md flex flex-col items-center justify-center text-white font-semibold transition-transform transform hover:scale-105"
        [ngStyle]="{ 'background-color': category.color || '#888' }"
      >
        <img
          *ngIf="category.images && category.images.length > 0"
          [src]="category.images[0]"
          [alt]="category.name"
          class="w-16 h-16 object-cover rounded-full mb-2"
        />
        <span class="text-center px-2 text-sm leading-tight">{{ category.name }}</span>
      </a>
    </div>
  </div>

  <button
    type="button"
    class="category-swiper-nav category-swiper-next"
    aria-label="Next categories"
  >
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
