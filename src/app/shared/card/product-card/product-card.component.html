<article
  appScrollReveal
  [revealDelay]="revealDelay"
  class="product-card group relative flex w-full flex-col overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] shadow-md transition-all duration-300"
>
  <a
    [routerLink]="['/product/details', product._id]"
    class="product-card__overlay"
    [attr.aria-label]="'View ' + product.name"
  ></a>

  <div class="product-card__image relative w-full overflow-hidden">
    <img
      [src]="product.images[0]"
      [alt]="product.name"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
    />

    <span
      *ngIf="isPromotionActive()"
      class="product-card__badge absolute left-2 top-2 z-[1] max-w-[85%] truncate rounded px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white shadow-md"
    >
      {{ getPromotionBadge() }}
    </span>

    <span
      *ngIf="isOwnProduct()"
      class="absolute bottom-0 left-0 z-[1] w-full bg-[var(--color-border)] py-1.5 text-center text-xs font-semibold text-[var(--color-text-secondary)]"
    >
      Your Product
    </span>
  </div>

  <div class="product-card__actions absolute right-2 top-2 z-10 flex flex-col gap-1.5">
    <button
      *ngIf="!isOwnProduct()"
      type="button"
      mat-icon-button
      class="product-card__action-btn"
      [disabled]="wishlistLoading"
      (click)="onWishlistClick($event, product._id)"
      aria-label="Add to wishlist"
    >
      <mat-icon>favorite</mat-icon>
    </button>

    <button
      *ngIf="!isOwnProduct()"
      type="button"
      mat-icon-button
      class="product-card__action-btn"
      [disabled]="cartLoading"
      (click)="onCartClick($event, product)"
      aria-label="Add to cart"
    >
      <mat-icon>{{ cartLoading ? 'hourglass_top' : 'shopping_cart' }}</mat-icon>
    </button>
  </div>

  <div class="product-card__body relative z-[1] w-full px-3 pb-3 pt-2.5">
    <p class="line-clamp-2 text-sm font-semibold leading-snug text-[var(--color-text)]">
      {{ product.name }}
    </p>

    <p class="mt-1 text-base font-bold text-[var(--color-text)]">
      Rs {{ product.price | number: '1.0-0' }}
    </p>

    <app-star-rating
      class="mt-1 block"
      [value]="product.averageRating"
      [readonly]="true"
      size="sm"
    ></app-star-rating>

    <div class="mt-1.5 flex items-center gap-3 text-[11px] text-[var(--color-text-secondary)]">
      <span *ngIf="isOwnProduct()" class="inline-flex items-center gap-1">
        <mat-icon class="!h-3.5 !w-3.5 !text-[14px]">visibility</mat-icon>
        {{ formatEngagementCount(product.viewCount) }}
      </span>
      <span class="inline-flex items-center gap-1">
        <mat-icon class="!h-3.5 !w-3.5 !text-[14px]">favorite</mat-icon>
        {{ formatEngagementCount(product.likeCount) }}
      </span>
    </div>
  </div>
</article>
