  <a routerLink="/" routerLinkActive="mobile-bottom-nav__link--active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-bottom-nav__link">
    <mat-icon>home</mat-icon>
    <span>Home</span>
  </a>
  <a routerLink="/shop" routerLinkActive="mobile-bottom-nav__link--active" class="mobile-bottom-nav__link">
    <mat-icon>grid_view</mat-icon>

  </a>

      <span *ngIf="cartCount > 0" class="mobile-bottom-nav__badge">{{ cartCount > 9 ? '9+' : cartCount }}</span>
