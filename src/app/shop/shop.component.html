<div class="container mx-auto shop-page-shell px-3 md:px-6">
  <div class="mb-4">
    <h1 class="section-title section-title-accent">Shop All Products</h1>
    <div class="section-underline"></div>
  </div>

  <div class="shop-chip-bar">
    <app-category-chips
      [categories]="categoryChips"
      [selectedId]="selectedCategoryId"
      (selectedChange)="onCategoryChipSelect($event)"
    ></app-category-chips>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
    <!-- Desktop filters -->
    <aside class="hidden md:block md:col-span-3">
      <div class="shop-filter-panel">
        <h2 class="section-title text-base mb-1">Filters</h2>
        <div class="section-underline mb-3"></div>

        <h3 class="text-sm font-semibold mb-2">Categories</h3>
        <div class="space-y-2">
          <button type="button" class="shop-sort-pill w-full text-left" [class.shop-sort-pill--active]="!selectedCategoryId" (click)="showAllProducts()">
            All Products
          </button>
          <button
            *ngFor="let cat of categories"
            type="button"
            class="shop-sort-pill w-full text-left"
            [class.shop-sort-pill--active]="selectedCategoryId === cat._id"
            (click)="selectCategory(cat)"
          >
            {{ cat.name }}
          </button>
        </div>

        <div *ngIf="selectedCategoryId && subCategories.length" class="mt-5">
          <h3 class="text-sm font-semibold mb-2">Sub Categories</h3>
          <div class="space-y-2">
            <button
              *ngFor="let sub of subCategories"
              type="button"
              class="shop-sort-pill w-full text-left"
              [class.shop-sort-pill--active]="selectedSubCategoryId === sub._id"
              (click)="selectSubCategory(sub)"
            >
              {{ sub.subCategory }}
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Products -->
    <section class="md:col-span-9 page-panel">
      <div class="shop-toolbar">
        <button type="button" class="shop-mobile-filter-btn" (click)="showMobileFilters = true">
          <mat-icon>filter_list</mat-icon>
          Filters
        </button>

        <div class="flex flex-wrap items-center gap-2 md:ml-auto">
          <span class="text-sm text-[var(--color-text-secondary)]">{{ totalItems }} products</span>
          <button type="button" class="shop-sort-pill" [class.shop-sort-pill--active]="sortOrder === 'low'" (click)="setSort('low')">Low to High</button>
          <button type="button" class="shop-sort-pill" [class.shop-sort-pill--active]="sortOrder === 'high'" (click)="setSort('high')">High to Low</button>
          <button type="button" class="grid-layout-toggle" (click)="cycleGridLayout()" [title]="gridLayout.gridLayoutLabel">
            <mat-icon>{{ gridLayout.gridLayoutIcon }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="grid gap-3 md:gap-4 product-grid flex-grow items-stretch" [ngClass]="gridLayout.productGridClass">
        <div *ngIf="!noProducts && products.length === 0" class="col-span-full text-center text-[var(--color-text-secondary)] py-10">
          Loading products...
        </div>
        <div *ngIf="noProducts" class="col-span-full text-center text-[var(--color-text-secondary)] py-10">
          No products found
        </div>
        <div *ngFor="let product of products" class="product-grid-item">
          <app-product-card [product]="product" variant="mockup"></app-product-card>
        </div>
      </div>

      <div class="flex justify-center md:justify-end mt-6">
        <mat-paginator
          [length]="totalItems"
          [pageSize]="itemsPerPage"
          [pageSizeOptions]="[itemsPerPage]"
          [pageIndex]="currentPage - 1"
          (page)="pageChanged($event)"
        ></mat-paginator>
      </div>
    </section>
  </div>
</div>

<!-- Mobile filter drawer -->
<div *ngIf="showMobileFilters" class="app-modal-backdrop fixed inset-0 bg-black/50 z-[200] md:hidden" (click)="showMobileFilters = false">
  <div class="absolute bottom-0 left-0 right-0 rounded-t-2xl bg-[var(--color-card)] p-4 max-h-[75dvh] overflow-y-auto app-modal-panel" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-semibold">Filters</h3>
      <button type="button" mat-icon-button (click)="showMobileFilters = false"><mat-icon>close</mat-icon></button>
    </div>
    <div class="space-y-2">
      <button type="button" class="shop-sort-pill w-full text-left" (click)="showAllProducts(); showMobileFilters = false">All Products</button>
      <button *ngFor="let cat of categories" type="button" class="shop-sort-pill w-full text-left" (click)="selectCategory(cat); showMobileFilters = false">{{ cat.name }}</button>
    </div>
  </div>
</div>
